name: MediFlow CI — Integración Continua & Contratos

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend API & Contract Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Suite de Pruebas Unitarias y de Contrato (Pytest)
        run: |
          python -m pytest backend-api/tests/ -v

  lint-openapi:
    name: Validar Especificación OpenAPI 3.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Validar Sintaxis OpenAPI con Redocly CLI
        uses: redocly/cli/actions/lint@v1
        with:
          args: specs/openapi.yaml

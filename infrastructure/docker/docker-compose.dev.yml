version: "3.9"

networks:
  mediflow-net:
    driver: bridge

services:
  # ── Backend: Hot-reload con uvicorn --reload ───────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: mediflow-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../../backend/.env
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      # Montar código fuente para hot-reload
      - ../../backend/app:/app/app:rw
    networks:
      - mediflow-net
    restart: unless-stopped

  # ── Frontend: Vite dev server con HMR ─────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: mediflow-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app:rw
      - /app/node_modules  # Aislar node_modules del host
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    networks:
      - mediflow-net
    restart: unless-stopped

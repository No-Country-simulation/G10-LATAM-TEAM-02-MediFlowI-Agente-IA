networks:
  mediflow-net:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: mediflow-postgres-dev
    environment:
      POSTGRES_DB: mediflow_dev
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: mediflow_dev_pass
    volumes:
      - mediflow-postgres-dev-data:/var/lib/postgresql/data
    networks:
      - mediflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow -d mediflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Backend: Hot-reload con uvicorn --reload ───────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: mediflow-backend-dev
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      DATABASE_URL: postgresql+asyncpg://mediflow:mediflow_dev_pass@postgres:5432/mediflow_dev
    ports:
      - "8000:8000"
    volumes:
      - ../../backend/app:/app/app:rw
      - ../../backend/alembic:/app/alembic:rw
      - mediflow-storage-dev:/app/storage
    networks:
      - mediflow-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend: Vite dev server con HMR ─────────────────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: development
    container_name: mediflow-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ../../frontend:/app:rw
      - /app/node_modules  # Aislar node_modules del host
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    networks:
      - mediflow-net
    restart: unless-stopped

volumes:
  mediflow-postgres-dev-data:
  mediflow-storage-dev:

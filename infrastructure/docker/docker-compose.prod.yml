# Orquestación de PRODUCCIÓN: Nginx (reverse proxy, único puerto :80) + Frontend + Backend + PostgreSQL.
# Uso:  make prod-docker

networks:
  mediflow-net:
    driver: bridge

services:
  postgres:
    image: postgres:17-alpine
    container_name: mediflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mediflow}
      POSTGRES_USER: ${POSTGRES_USER:-mediflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el entorno}
    volumes:
      - mediflow-postgres-data:/var/lib/postgresql/data
    networks:
      - mediflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: mediflow:latest
    container_name: mediflow-backend
    env_file:
      - path: ../../backend/.env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mediflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mediflow}
    expose:
      - "8000"                 # interno, NO publicado
    volumes:
      - mediflow-storage:/app/storage
    networks:
      - mediflow-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: mediflow-frontend:latest
    container_name: mediflow-frontend
    expose:
      - "80"                   # interno, NO publicado
    networks:
      - mediflow-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: mediflow-nginx
    ports:
      - "${MEDIFLOW_HTTP_PORT:-80}:80"   # único puerto expuesto
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - mediflow-net
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  mediflow-postgres-data:
  mediflow-storage:
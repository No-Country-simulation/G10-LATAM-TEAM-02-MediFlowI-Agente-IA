[project]
name = "mediflow-backend"
version = "1.0.0"
description = "Agente Autónomo de Triaje Clínico — MediFlow Backend"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  # Web framework
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  # Agente IA
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langchain-openai>=0.2.0",
  # Validación de datos
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  # Procesamiento de documentos
  "pymupdf>=1.24.0",
  "pillow>=10.0.0",
  "python-multipart>=0.0.12",
  # OCI Object Storage
  "oci>=2.130.0",
  # HTTP client
  "httpx>=0.27.0",
  # Utils
  "python-dotenv>=1.0.0",
  "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",
  "schemathesis>=3.27.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

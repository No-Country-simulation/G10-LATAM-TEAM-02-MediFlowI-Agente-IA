[project]
name = "mediflow-backend"
version = "1.0.0"
description = "Agente Autónomo de Triaje Clínico — MediFlow Backend"
readme = "README.md"
requires-python = ">=3.11"

[project.dependencies]
# Web framework
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.30.0", extras = ["standard"] }

# Agente IA
langgraph = ">=0.2.0"
langchain = ">=0.3.0"
langchain-google-genai = ">=2.0.0"
langchain-openai = ">=0.2.0"   # opcional, fallback

# Validación de datos
pydantic = ">=2.8.0"
pydantic-settings = ">=2.4.0"

# Procesamiento de documentos
pymupdf = ">=1.24.0"           # extracción texto desde PDF
pillow = ">=10.0.0"             # procesamiento de imágenes
python-multipart = ">=0.0.12"  # upload de archivos

# OCI Object Storage
oci = ">=2.130.0"

# HTTP client
httpx = ">=0.27.0"

# Utils
python-dotenv = ">=1.0.0"
structlog = ">=24.0.0"          # logging estructurado

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "httpx>=0.27.0",              # TestClient async
  "schemathesis>=3.27.0",       # contract testing desde OpenAPI
  "ruff>=0.6.0",                # linter + formatter
  "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

openapi: 3.0.3
info:
  title: MediFlow API - Agente Autónomo para Triaje Clínico
  description: |
    Especificación oficial OpenAPI 3.0 para **MediFlow**.
    Sistema inteligente para la ingesta, clasificación, extracción y enrutamiento
    de documentos clínicos y administrativos en el sector HealthTech.
    Proyecto desarrollado para la Hackathon ONE Grupo 10 (Oracle Next Education & Alura).
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Equipo MediFlow (Grupo 10)

servers:
  - url: http://localhost:8000
    description: Servidor de Desarrollo Local
  - url: https://api.mediflow.cloud
    description: Despliegue en OCI Compute (Always Free Ampere A1)

security: []

paths:
  /health:
    get:
      summary: Verificación de salud y estado del sistema (Smoke Check)
      operationId: checkHealth
      tags:
        - Monitoreo
      responses:
        '200':
          description: Sistema operativo y servicios conectados
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                  - version
                  - services
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
                  version:
                    type: string
                    example: 1.0.0
                  services:
                    type: object
                    properties:
                      gemini_llm:
                        type: string
                        example: connected
                      oci_object_storage:
                        type: string
                        example: connected
        '400':
          description: Solicitud de monitoreo inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/triaje:
    post:
      summary: Ingesta y Triaje de Documento Clínico
      description: |
        Recibe un documento clínico (PDF digitalizado, imagen en base64 o texto crudo),
        lo procesa mediante el agente multimodal Gemini y el grafo de decisión condicional,
        extrae entidades clínicas con código CIE-10 y lo enruta al departamento correspondiente,
        persistiendo el resultado en OCI Object Storage.
      operationId: procesarTriajeClinico
      tags:
        - Triaje Clínico
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentoClinicoInput'
      responses:
        '200':
          description: Triaje completado exitosamente y persistido en OCI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaTriaje'
        '400':
          description: Payload inválido o datos requeridos faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error interno en el procesamiento del agente o conectores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auditoria/{documento_id}:
    post:
      summary: Resolución Human-in-the-Loop (Aprobación / Edición Médica)
      description: |
        Permite a un auditor médico humano revisar documentos que tuvieron baja confianza (< 0.85),
        corregir campos clínicos dudosos y aprobar o rechazar la derivación, moviendo el objeto
        de `/auditoria_humana/` a `/procesados/` en OCI Object Storage.
      operationId: resolverAuditoriaHumana
      tags:
        - Human-in-the-Loop
      parameters:
        - name: documento_id
          in: path
          required: true
          description: Identificador del documento en revisión
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
                - datos_corregidos
                - auditor_nombre
              properties:
                decision:
                  type: string
                  enum: [aprobado, rechazado]
                auditor_nombre:
                  type: string
                  example: Dr. Alejandro Morales
                comentarios:
                  type: string
                  example: Confirmada dosis de heparina e indicación de guardia
                datos_corregidos:
                  $ref: '#/components/schemas/DatosClinicosExtraidos'
      responses:
        '200':
          description: Auditoría resuelta y estado actualizado en OCI
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: auditoria_completada
                  documento_id:
                    type: string
                  nueva_ruta_oci:
                    type: string
                    example: procesados/urgentes/DOC-CLIN-2026-8942.json
        '400':
          description: Datos de auditoría inválidos o incompletos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Documento clínico no encontrado para auditar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/metricas:
    get:
      summary: Métricas de rendimiento y volumen de triaje
      operationId: obtenerMetricasTriaje
      tags:
        - Monitoreo
      responses:
        '200':
          description: Estadísticas operativas del sistema
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_documentos_procesados:
                    type: integer
                    example: 142
                  urgencias_criticas_detectadas:
                    type: integer
                    example: 18
                  casos_derivados_hitl:
                    type: integer
                    example: 12
                  porcentaje_automatizacion:
                    type: number
                    example: 91.5
        '400':
          description: Parámetros de consulta de métricas inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    DocumentoClinicoInput:
      type: object
      required:
        - documento_id
        - tipo_archivo
        - canal_origen
      properties:
        documento_id:
          type: string
          example: DOC-CLIN-2026-8942
        tipo_archivo:
          type: string
          enum: [PDF, IMAGEN, TEXTO, JSON]
          example: PDF
        documento_texto:
          type: string
          example: HOSPITAL SANTA LUCIA - INFORME RADIOLOGICO. Paciente Carlos Mendes...
        documento_base64:
          type: string
          description: Contenido del archivo en base64 si es PDF escaneado o imagen
        canal_origen:
          type: string
          example: Guardia_Emergencias

    RespuestaTriaje:
      type: object
      required:
        - status
        - documento_id
        - clasificacion
        - datos_extraidos
        - decision_enrutamiento
        - almacenamiento_oci
      properties:
        status:
          type: string
          enum: [procesado, pendiente_auditoria, error]
          example: procesado
        documento_id:
          type: string
          example: DOC-CLIN-2026-8942
        clasificacion:
          type: object
          required:
            - tipo_documento
            - especialidad
            - nivel_prioridad
            - score_confianza_clasificacion
          properties:
            tipo_documento:
              type: string
              example: Informe de Estudio por Imagenes
            especialidad:
              type: string
              example: Radiologia / Neumonologia
            nivel_prioridad:
              type: string
              enum: [Rutina, Prioritario, Urgente]
              example: Urgente
            score_confianza_clasificacion:
              type: number
              format: float
              example: 0.99
        datos_extraidos:
          $ref: '#/components/schemas/DatosClinicosExtraidos'
        decision_enrutamiento:
          type: object
          required:
            - destino_principal
            - requiere_auditoria_humana
            - justificacion_enrutamiento
          properties:
            destino_principal:
              type: string
              enum:
                - Cola_Emergencia_Medica
                - Cola_Auditoria_Humana
                - Farmacia_Hospitalaria
                - Historia_Clinica_Electronica
                - Auditoria_Autorizaciones
              example: Cola_Emergencia_Medica
            requiere_auditoria_humana:
              type: boolean
              example: false
            justificacion_enrutamiento:
              type: string
              example: Hallazgo critico de alta gravedad (TEP agudo) detectado en paciente sintomatico.
            notificacion_generada:
              type: object
              nullable: true
              properties:
                canal:
                  type: string
                  example: Alerta_Guardia_Medica
                mensaje:
                  type: string
                  example: "ALERTA URGENTE: Informe critico de TEP Agudo para Carlos Mendes."
        almacenamiento_oci:
          type: object
          required:
            - bucket
            - ruta_objeto
            - status_backup
          properties:
            bucket:
              type: string
              example: mediflow-documentos-clinicos
            ruta_objeto:
              type: string
              example: procesados/urgentes/DOC-CLIN-2026-8942.json
            status_backup:
              type: string
              enum: [exito, pendiente, fallido]
              example: exito

    DatosClinicosExtraidos:
      type: object
      required:
        - paciente
        - diagnostico_principal
      properties:
        paciente:
          type: object
          properties:
            nombre:
              type: string
              example: Carlos Eduardo Mendes
            nome:
              type: string
            edad:
              type: integer
              nullable: true
              example: 52
            identificacion:
              type: string
              nullable: true
        medico_solicitante:
          type: object
          properties:
            nombre:
              type: string
              example: Dra. Renata Silveira
            matricula:
              type: string
              example: "145892"
        estudio_realizado:
          type: string
          nullable: true
          example: Tomografia de Torax con contraste
        diagnostico_principal:
          type: string
          example: Tromboembolismo Pulmonar Agudo (TEP)
        cie10_sugerido:
          type: string
          nullable: true
          example: I26.9
        medicamentos:
          type: array
          items:
            type: object
            required:
              - nombre
            properties:
              nombre:
                type: string
                example: Enoxaparina
              dosis:
                type: string
                example: 80 mg cada 12h
              frecuencia:
                type: string

    ErrorResponse:
      type: object
      required:
        - error
        - mensaje
      properties:
        error:
          type: string
          example: ValidationError
        mensaje:
          type: string
          example: El campo 'documento_id' es obligatorio y debe ser alfanumérico.

users:
  get:
    tags: [users]
    summary: Listar usuarios
    operationId: listarUsuarios
    responses:
      "200":
        description: Usuarios registrados
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "../components/schemas.yaml#/schemas/Usuario" }
      "403": { description: Requiere rol ADMINISTRADOR }
  post:
    tags: [users]
    summary: Registrar usuario
    operationId: registrarUsuario
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: "../components/schemas.yaml#/schemas/UsuarioCrear" }
    responses:
      "201":
        description: Usuario registrado
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Usuario" }
      "400": { description: Usuario duplicado o datos inválidos }
      "403": { description: Requiere rol ADMINISTRADOR }

userById:
  put:
    tags: [users]
    summary: Actualizar usuario, rol o estado
    operationId: actualizarUsuario
    parameters:
      - name: user_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              nombres: { type: string }
              apellidos: { type: string }
              correo: { type: string, nullable: true }
              telefono: { type: string, nullable: true }
              rol: { type: string, enum: [ADMINISTRADOR, OPERADOR, AUDITOR, SUPERVISOR] }
              estado: { type: string, enum: [ACTIVO, INACTIVO] }
              password: { type: string, format: password, minLength: 12 }
    responses:
      "200":
        description: Usuario actualizado
        content:
          application/json:
            schema: { $ref: "../components/schemas.yaml#/schemas/Usuario" }
      "404": { description: Usuario no encontrado }

login:
  post:
    tags:
    - auth
    summary: Iniciar sesión
    operationId: iniciarSesion
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - documento_identidad
            - password
            properties:
              documento_identidad:
                type: string
                pattern: ^\d{8}$
              password:
                type: string
                format: password
    responses:
      '200':
        description: Sesión iniciada
        content:
          application/json:
            schema:
              type: object
              required:
              - access_token
              - token_type
              - user
              - mensaje
              properties:
                access_token:
                  type: string
                token_type:
                  type: string
                  example: Bearer
                user:
                  $ref: ../components/schemas.yaml#/schemas/Usuario
                mensaje:
                  type: string
      '401':
        $ref: ../components/responses.yaml#/responses/Unauthorized
      '403':
        description: Usuario inactivo
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/schemas/ErrorResponse
      '503':
        description: PostgreSQL no disponible para crear la sesión
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/schemas/ErrorResponse
    description: Iniciar sesión.
logout:
  post:
    tags:
    - auth
    summary: Cerrar sesión
    operationId: cerrarSesion
    responses:
      '200':
        description: Sesión invalidada
      '503':
        description: PostgreSQL no disponible para revocar la sesión
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/schemas/ErrorResponse
    description: Cerrar sesión.
me:
  get:
    tags:
    - auth
    summary: Consultar usuario autenticado
    operationId: consultarSesion
    responses:
      '200':
        description: Usuario de la sesión
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/schemas/Usuario
      '401':
        $ref: ../components/responses.yaml#/responses/Unauthorized
      '503':
        description: PostgreSQL no disponible para validar la sesión
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/schemas/ErrorResponse
    description: Consultar usuario autenticado.
signup:
  post:
    tags:
    - auth
    summary: Registrar usuario
    operationId: registrarUsuario
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/schemas/UsuarioCrear
    responses:
      '201':
        description: Registro exitoso, pendiente de aprobación
        content:
          application/json:
            schema:
              type: object
              required:
              - message
              - user
              properties:
                message:
                  type: string
                  example: User registered successfully. Pending admin approval.
                user:
                  $ref: ../components/schemas.yaml#/schemas/Usuario
      '400':
        $ref: ../components/responses.yaml#/responses/BadRequest
      '409':
        description: El correo ya está registrado
        content:
          application/json:
            schema:
              $ref: ../components/schemas.yaml#/schemas/ErrorResponse
      '500':
        $ref: ../components/responses.yaml#/responses/InternalError
    description: Registro de usuario en estado pendiente.

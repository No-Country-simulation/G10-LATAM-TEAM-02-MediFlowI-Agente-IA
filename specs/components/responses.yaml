responses:
  TriageSuccess:
    description: Documento procesado exitosamente
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/schemas/ResultadoTriaje
  TriagePendingAudit:
    description: Documento derivado a auditoría humana
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/schemas/ResultadoTriaje
  BadRequest:
    description: Solicitud inválida o documento malformado
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/schemas/ErrorResponse
  Unauthorized:
    description: Token Bearer ausente, inválido o expirado
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/schemas/ErrorResponse
  NotFound:
    description: Documento no encontrado
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/schemas/ErrorResponse
  InternalError:
    description: Error interno del servidor / agente
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/schemas/ErrorResponse
  ServiceUnavailable:
    description: Dependencia requerida no disponible (PostgreSQL, almacenamiento o proveedor LLM)
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/schemas/ErrorResponse
  ValidationError:
    description: Datos de solicitud incompletos o inválidos
    content:
      application/json:
        schema:
          $ref: ./schemas.yaml#/schemas/HTTPValidationError

schemas:
  # ──────────────────────────────────────────────
  # INPUT
  # ──────────────────────────────────────────────
  DocumentoClinico:
    type: object
    required:
      - documento_id
      - tipo_archivo
      - canal_origen
    properties:
      documento_id:
        type: string
        example: "DOC-CLIN-2026-8942"
        description: Identificador único del documento
      tipo_archivo:
        type: string
        enum: [PDF, IMAGEN, TEXTO, JSON]
        example: "PDF"
      documento_texto:
        type: string
        nullable: true
        description: Contenido en texto plano (si ya está extraído)
        example: "HOSPITAL SANTA LUCIA - INFORME DE ESTUDIO RADIOLOGICO..."
      documento_base64:
        type: string
        nullable: true
        description: Contenido del archivo en base64 (para PDF/imagen)
      canal_origen:
        type: string
        example: "Guardia_Emergencias"
        description: Sistema o canal que originó el documento
      metadata:
        type: object
        nullable: true
        additionalProperties: true
        description: Metadatos adicionales del documento

  # ──────────────────────────────────────────────
  # OUTPUT — Componentes del resultado
  # ──────────────────────────────────────────────
  Clasificacion:
    type: object
    required:
      - tipo_documento
      - nivel_prioridad
      - score_confianza_clasificacion
    properties:
      tipo_documento:
        type: string
        enum:
          - Informe Clínico
          - Evolución Clínica
          - Epicrisis
          - Receta Médica
          - Orden Médica
          - Orden de Procedimiento
          - Solicitud de Interconsulta
          - Informe de Laboratorio
          - Informe de Estudio por Imágenes
          - Informe Quirúrgico
          - Consentimiento Informado
          - Certificado Médico
          - Referencia y Contrarreferencia
          - Registro de Vacunación
          - Otro
        example: "Informe de Estudio por Imágenes"
      especialidad:
        type: string
        nullable: true
        example: "Radiologia / Neumonologia"
      nivel_prioridad:
        type: string
        enum: [Urgente, Rutina, Ambiguo]
        example: "Urgente"
      score_confianza_clasificacion:
        type: number
        format: float
        minimum: 0.0
        maximum: 1.0
        example: 0.99

  Paciente:
    type: object
    properties:
      nombre:
        type: string
        nullable: true
        example: "Carlos Eduardo Mendes"
      edad:
        type: integer
        nullable: true
        example: 52
      id_paciente:
        type: string
        nullable: true
      documento_identidad:
        type: string
        nullable: true
      historia_clinica:
        type: string
        nullable: true

  MedicoSolicitante:
    type: object
    properties:
      nombre:
        type: string
        nullable: true
        example: "Dra. Renata Silveira"
      matricula:
        type: string
        nullable: true
        example: "145892"

  DatosExtraidos:
    type: object
    properties:
      paciente:
        allOf:
          - $ref: "#/schemas/Paciente"
        nullable: true
      medico_solicitante:
        allOf:
          - $ref: "#/schemas/MedicoSolicitante"
        nullable: true
      estudio_realizado:
        type: string
        nullable: true
        example: "Tomografia de Torax con contraste"
      diagnostico_principal:
        type: string
        nullable: true
        example: "Tromboembolismo Pulmonar Agudo (TEP)"
      cie10_sugerido:
        type: string
        nullable: true
        example: "I26.9"
      hallazgos_clave:
        type: array
        items:
          type: string
        nullable: true

  Notificacion:
    type: object
    properties:
      canal:
        type: string
        example: "Alerta_Guardia_Medica"
      mensaje:
        type: string
        example: "ALERTA URGENTE: Informe crítico de TEP Agudo..."

  DecisionEnrutamiento:
    type: object
    required:
      - destino_principal
      - requiere_auditoria_humana
      - justificacion_enrutamiento
    properties:
      destino_principal:
        type: string
        enum: [Cola_Emergencia_Medica, Cola_Rutina, Cola_Auditoria_Humana, Cola_Revision_Ambigua]
        example: "Cola_Emergencia_Medica"
      requiere_auditoria_humana:
        type: boolean
        example: false
      justificacion_enrutamiento:
        type: string
        example: "Hallazgo crítico de alta gravedad detectado."
      notificacion_generada:
        $ref: "#/schemas/Notificacion"
        nullable: true

  AlmacenamientoOCI:
    type: object
    properties:
      bucket:
        type: string
        nullable: true
        example: "mediflow-documentos-clinicos"
      ruta_objeto:
        type: string
        nullable: true
        example: "urgentes/DOC-CLIN-2026-8942/resultado.json"
      archivo_original:
        type: string
        nullable: true
      resultado_json:
        type: string
        nullable: true
      nombre_original:
        type: string
        nullable: true
      status_backup:
        type: string
        enum: [exito, error, pendiente]
        example: "exito"

  ResultadoTriaje:
    type: object
    required:
      - status
      - documento_id
      - clasificacion
      - datos_extraidos
      - decision_enrutamiento
    properties:
      status:
        type: string
        enum: [recibido, procesando, procesado, pendiente_auditoria, rechazado, no_soportado, error]
        example: "procesado"
      documento_id:
        type: string
        example: "DOC-CLIN-2026-8942"
      clasificacion:
        $ref: "#/schemas/Clasificacion"
      datos_extraidos:
        $ref: "#/schemas/DatosExtraidos"
      decision_enrutamiento:
        $ref: "#/schemas/DecisionEnrutamiento"
      almacenamiento_oci:
        $ref: "#/schemas/AlmacenamientoOCI"
        nullable: true
      tiempo_procesamiento_ms:
        type: integer
        nullable: true
        example: 1240

  # ──────────────────────────────────────────────
  # AUDIT — Human-in-the-Loop
  # ──────────────────────────────────────────────
  DecisionAuditoria:
    type: object
    required:
      - decision
    properties:
      decision:
        type: string
        enum: [aprobar, rechazar, reclasificar]
      nueva_clasificacion:
        type: object
        additionalProperties: true
        nullable: true
      datos_corregidos:
        type: object
        additionalProperties: true
        nullable: true
      comentario:
        type: string
        nullable: true

  # ──────────────────────────────────────────────
  # ERROR
  # ──────────────────────────────────────────────
  ErrorResponse:
    type: object
    required:
      - error
      - mensaje
    properties:
      error:
        type: string
        example: "DOCUMENTO_INVALIDO"
      mensaje:
        type: string
        example: "El documento no pudo ser procesado."
      detalle:
        type: string
        nullable: true

  HealthResponse:
    type: object
    required:
      - status
      - version
      - postgres_disponible
    properties:
      status:
        type: string
        enum: [ok, unavailable]
        example: "ok"
      version:
        type: string
        example: "1.0.0"
      postgres_disponible:
        type: boolean
        example: true
      llm_disponible:
        type: boolean
        example: true
      oci_disponible:
        type: boolean
        example: true

  Usuario:
    type: object
    required: [id, documento_identidad, nombres, apellidos, rol, estado]
    properties:
      id: { type: string, format: uuid }
      documento_identidad: { type: string, pattern: '^\d{8}$' }
      nombres: { type: string }
      apellidos: { type: string }
      correo: { type: string, nullable: true }
      telefono: { type: string, nullable: true }
      rol: { type: string, enum: [ADMINISTRADOR, OPERADOR, AUDITOR, SUPERVISOR] }
      estado: { type: string, enum: [ACTIVO, INACTIVO] }
      created_at: { type: string, nullable: true }

  UsuarioCrear:
    type: object
    required: [documento_identidad, password, nombres, apellidos]
    properties:
      documento_identidad: { type: string, pattern: '^\d{8}$' }
      password: { type: string, format: password, minLength: 12 }
      nombres: { type: string }
      apellidos: { type: string }
      correo: { type: string, nullable: true }
      telefono: { type: string, nullable: true }
      rol: { type: string, enum: [ADMINISTRADOR, OPERADOR, AUDITOR, SUPERVISOR], default: OPERADOR }
      estado: { type: string, enum: [ACTIVO, INACTIVO], default: ACTIVO }

  ConfiguracionSistema:
    type: object
    required: [storage_mode, oci_configured, llm_provider, llm_configured, database_url_configured]
    properties:
      storage_mode: { type: string, enum: [LOCAL, OCI] }
      oci_configured: { type: boolean }
      llm_provider: { type: string }
      llm_configured: { type: boolean }
      database_url_configured: { type: boolean }

  PacienteRegistrar:
    type: object
    required: [tipo_documento, numero_documento, nombres, apellidos]
    properties:
      tipo_documento: { type: string, enum: [DNI, CE, PASAPORTE] }
      numero_documento: { type: string }
      historia_clinica: { type: string, nullable: true }
      nombres: { type: string }
      apellidos: { type: string }
      fecha_nacimiento: { type: string, format: date, nullable: true }
      sexo: { type: string, enum: [M, F, OTRO], nullable: true }
      telefono: { type: string, nullable: true }
      correo: { type: string, nullable: true }

  PacienteRegistrado:
    allOf:
      - $ref: "#/schemas/PacienteRegistrar"
      - type: object
        required: [id, nombre_completo]
        properties:
          id: { type: string, format: uuid }
          nombre_completo: { type: string }
          created_at: { type: string, nullable: true }
